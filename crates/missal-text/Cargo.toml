[package]
name = "missal-text"
description = "Missal text engine: Urdu-capable shaping, bidi layout, painting and text widgets on Parley and GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
parley.workspace = true
swash.workspace = true
unicode-general-category.workspace = true
gpui-pre-wgpu = { workspace = true, optional = true }
image.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[features]
test-support = ["gpui-kit/test-support"]
headless = ["test-support", "dep:gpui-pre-wgpu"]

[[example]]
name = "gallery"
required-features = ["headless"]

[[example]]
name = "bench"

[lints]
workspace = true
