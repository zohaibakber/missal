<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="missal.css"><script src="chrome.js"></script>
<style>
.under { position: absolute; inset: 44px 0 0 0; padding: 24px; opacity: 1; }
.pal { position: absolute; left: 50%; top: 88px; width: 600px; margin-left: -300px; background: var(--bg); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; }
.dark .pal { background: var(--raised); }
.pin { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--border); font-size: 15px; }
.grp { padding: 10px 16px 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
.it { height: 40px; margin: 0 6px; border-radius: 6px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; }
.it.hl { background: var(--hover); }
.it .no { width: 92px; flex: none; font-weight: 500; }
.it mark { background: none; color: var(--accent-text); font-weight: 600; }
.it .ur { font-size: 16px; line-height: 30px; margin-top: -2px; }
.pf { height: 36px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.pf span { display: flex; align-items: center; gap: 5px; }
</style></head>
<body><div class="app" id="app"></div>
<script>
const hits = [["11/2026", "dhoka", "d-challan", 11], ["11/2025", "", "d-challan", 7], ["11/2024", "", "d-open", 6], ["11/2023", "", "d-inv", 3], ["11/2022", "", "d-closed", 8], ["11/2021", "", "d-open", 0]];
document.getElementById('app').innerHTML = `
${titlebar({ title: 'FIRs', meta: '<span class="num">90</span>' })}
<div class="under">
  <div style="height:44px"></div>
  ${Array.from({ length: 12 }).map(() => `<div style="height:44px;border-bottom:1px solid var(--border)"></div>`).join('')}
</div>
<div class="scrim"></div>
<div class="pal">
  <div class="pin">${ICON('search')}<span class="ltr num">11/20</span><span class="caret" style="margin-left:-8px"></span><div class="grow"></div><span class="kbd">Esc</span></div>
  <div class="grp">FIRs</div>
  ${hits.map((h, i) => `<div class="it${i === 0 ? ' hl' : ''}"><span class="dot ${h[2]}"></span><span class="no num ltr"><mark>11/20</mark>${h[0].slice(5)}</span><span class="ur trunc grow" style="text-align:left">${OFFENCES[h[3]]}</span>${i === 0 ? `<span class="t12 m row" style="gap:6px">Open<span class="kbd">↵</span></span>` : ''}</div>`).join('')}
  <div class="pf"><span><span class="kbd">↑</span><span class="kbd">↓</span>Move</span><span><span class="kbd">↵</span>Open</span><span><span class="kbd">Esc</span>Close</span><div class="grow"></div><span>6 FIRs</span></div>
</div>`;
</script></body></html>
