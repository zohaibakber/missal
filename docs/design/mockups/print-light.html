<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="missal.css"><script src="chrome.js"></script>
<style>
.hd { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--border); }
.body { flex: 1; min-height: 0; display: flex; }
.side { width: 280px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.warn { margin: 12px; border-radius: 8px; background: var(--warn-sub); color: var(--warn); padding: 10px 12px; display: flex; gap: 10px; font-size: 13px; line-height: 18px; }
.warn b { font-weight: 600; }
.warn a { color: var(--warn); text-decoration: underline; text-underline-offset: 2px; font-weight: 500; }
.lh { height: 32px; display: flex; align-items: center; padding: 0 16px; }
.dr { height: 44px; margin: 0 8px; border-radius: 6px; display: flex; flex-direction: row-reverse; align-items: center; gap: 10px; padding: 0 10px; }
.dr.on { background: var(--hover); }
.dr .ur { font-size: 16px; line-height: 30px; }
.dr .pg { font-size: 12px; color: var(--subtle); flex: none; }
.dr.off .ur { color: var(--subtle); }
.cv { flex: 1; min-width: 0; background: var(--canvas); display: flex; flex-direction: column; }
.pages { flex: 1; overflow: hidden; display: flex; justify-content: center; padding: 20px 0 0; }
.paper { width: 446px; height: 631px; background: #fff; color: #111; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.08); padding: 34px 38px; direction: rtl; font-family: "Nastaleeq", "Inter"; font-size: 11.5px; line-height: 23px; word-spacing: .14em; }
.rule { border-top: 1px solid #111; margin: 1px 0; }
.dline { display: flex; justify-content: space-between; }
.ft { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-top: 1px solid var(--border); background: var(--bg); }
.pgin { width: 44px; height: 28px; border: 1px solid var(--input); border-radius: 6px; display: grid; place-items: center; font-size: 13px; }
.zm { height: 28px; padding: 0 8px 0 10px; border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; gap: 6px; font-size: 13px; }
</style></head>
<body><div class="app" id="app"></div>
<script>
const docs = [["ضمنی حصول ریمانڈ جسمانی", 2, true], ["مسل مقدمہ میرے سپرد ہوئی", 1, true], ["گینگ انویسٹی گیشن ڈسچارج", 44, false]];
document.getElementById('app').innerHTML = `
${titlebar({ title: 'Print FIR 1/2021', meta: '<span class="num">2 documents · 3 pages</span>', actions: `<div class="ib" title="Save as PDF (Ctrl Shift S)">${ICON('file-down')}</div><div class="btn primary sm">${ICON('printer', 'i14')}Print<span class="kbd">Ctrl P</span></div><div class="vr"></div>` })}
<div class="body">
  <div class="side">
    <div class="warn"><span style="display:flex;padding-top:1px">${ICON('triangle-alert', 'i14')}</span><div><b>3 fields are empty.</b> They will print as their names, for example <span class="ur" style="font-size:14px;line-height:18px">تھانہ نام</span>. <a>Fill them in</a></div></div>
    <div class="lh"><span class="t12 w5 m">Documents to print</span></div>
    ${docs.map((d, i) => `<div class="dr${i === 0 ? ' on' : ''}${d[2] ? '' : ' off'}"><div class="chk${d[2] ? ' on' : ''}">${d[2] ? ICON('check', 'i12') : ''}</div><span class="ur trunc grow">${d[0]}</span><span class="pg num">${d[1]} ${d[1] === 1 ? 'page' : 'pages'}</span></div>`).join('')}
    <div style="margin-top:auto;padding:12px 16px;border-top:1px solid var(--border)" class="t12 s">You choose the printer in the next step.</div>
  </div>
  <div class="cv">
    <div class="pages"><div class="paper">
      <div class="dline"><span>تھانہ نام</span><span style="margin-left:100px">ضلع نام</span></div>
      <div>سرکاربذریعہ &nbsp;محمد اسلم ولد اکرم سکنہ چک ۴۵</div>
      <div class="rule"></div>
      <div class="dline"><span>مقدمہ نمبر : <span class="ltr">1/2021</span></span><span>مورخہ: <span class="ltr">14-11-2021</span></span><span>جرم: راہزنی ۳۹۴ ت پ</span><span>تھانہ نام</span></div>
      <div class="rule"></div>
      <div>بنام: زاہد حسین ولد حسین بخش سکنہ ساہیوال</div>
      <div style="padding-right:26px">طارق جاوید ولد جاوید اقبال سکنہ فیصل آباد</div>
      <div class="rule"></div>
      <div style="text-align:center;font-size:16px;line-height:32px;margin:14px 0 6px"><span style="border-bottom:1px solid #111">درخواست برائے حصول ریمانڈ حوالات جوڈیشل ۱۴ یوم</span></div>
      <div style="text-align:justify">جناب عالی! گزارش ہے کہ ملزم زاہد حسین ولد حسین بخش سکنہ ساہیوال، طارق جاوید ولد جاوید اقبال سکنہ فیصل آباد کو مقدمہ عنوانِ بالا میں حسبِ ضابطہ گرفتار کیا گیا ہے۔ ملزم نے مقدمہ ہذا میں جزوی برآمدگی کروا دی ہے۔ مزید کی توقع نہ ہے۔ ملزم کی حراست اختیاری پولیس امروز اختتام پذیر ہے۔ تکمیل تفتیش ہو چکی ہے جبکہ تکمیل کاغذات چالان بقایا ہے، ملزم کو پیش عدالت کیا جا رہا ہے، لہذا بذریعہ درخواست استدعا ہے کہ ملزم کا ریمانڈ حوالات جوڈیشل ۱۴ یوم منظور فرما کر حوالات جوڈیشل میں رکھے جانے اور آئندہ پیش کیے جانے کا حکم فرمایا جائے۔</div>
      <div style="margin-top:28px;padding-right:200px">انسپکٹر ملک ارشد</div>
      <div style="padding-right:200px">تاریخ ڈسچارج</div>
    </div></div>
    <div class="ft">
      <div class="ib sm">${ICON('chevron-left', 'i14')}</div><span class="t13 m">Page</span><div class="pgin num">1</div><span class="t13 m num">of 3</span><div class="ib sm">${ICON('chevron-right', 'i14')}</div>
      <div class="grow"></div>
      <div class="ib sm">${ICON('minus', 'i14')}</div>
      <div class="zm num">Fit page<span class="s">${ICON('chevron-down', 'i12')}</span></div>
      <div class="ib sm">${ICON('plus', 'i14')}</div>
    </div>
  </div>
</div>`;
</script></body></html>
