<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="missal.css"><script src="chrome.js"></script>
<style>
.scroll { flex: 1; min-height: 0; overflow: hidden; }
.form { width: 760px; margin: 0 auto; direction: rtl; padding: 8px 0 40px; }
.sh { display: flex; align-items: center; gap: 12px; margin: 20px 0 12px; }
.sh .ur { font-size: 18px; line-height: 34px; }
.sh .hr { flex: 1; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.grid3 { grid-template-columns: 1fr 1fr 1fr; }
.full { grid-column: 1 / -1; }
.fl { display: flex; flex-direction: column; gap: 4px; }
.lab { font-family: "Nastaleeq"; font-size: 15px; line-height: 28px; word-spacing: .14em; display: flex; gap: 4px; align-items: center; }
.req { color: var(--danger); font-family: Inter; font-size: 13px; }
.inp { height: 36px; border: 1px solid var(--input); border-radius: 6px; background: var(--bg); display: flex; align-items: center; padding: 0 10px; gap: 8px; }
.inp .ur { font-size: 16px; line-height: 30px; margin-top: -2px; }
.inp.ltrv { direction: rtl; }
.inp .lv { direction: ltr; font-size: 14px; }
.inp.focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.inp > .s { display: flex; }
.ph2 { color: var(--subtle); font-size: 13px; direction: ltr; }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: flex; align-items: center; gap: 8px; }
.li .n { width: 18px; text-align: center; font-size: 12px; color: var(--subtle); direction: ltr; }
.addl { align-self: flex-start; height: 28px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); direction: ltr; padding: 0 8px; border-radius: 6px; }
.foot { height: 56px; flex: none; border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 8px; background: var(--bg); }
</style></head>
<body><div class="app" id="app"></div>
<script>
const inp = (v, opts = {}) => `<div class="inp${opts.focus ? ' focus' : ''}">${v}${opts.after || ''}</div>`;
const ur = (t) => `<span class="ur trunc grow">${t}</span>`;
const lv = (t) => `<span class="lv num">${t}</span><div class="grow"></div>`;
const field = (label, body, req, cls) => `<div class="fl${cls ? ' ' + cls : ''}"><div class="lab">${label}${req ? '<span class="req">*</span>' : ''}</div>${body}</div>`;
const cal = `<span class="s">${ICON('calendar', 'i14')}</span>`;
document.getElementById('app').innerHTML = `
${titlebar({ title: 'New FIR', meta: '<span class="t12 s">Fields marked <span style="color:var(--danger)">*</span> are required</span>' })}
<div class="scroll"><div class="form">
  <div class="sh"><span class="ur">مقدمہ</span><div class="hr"></div></div>
  <div class="grid">
    ${field('ایف آئی آر نمبر', inp(lv('412/2026')), true)}
    ${field('حالت', inp(`<span class="dot d-open"></span>${ur('زیر التوا')}<span class="s">${ICON('chevrons-up-down', 'i14')}</span>`))}
    ${field('جرم', inp(ur('ڈکیتی ۳۹۲ ت پ')), true)}
    ${field('مدعی مقدمہ', inp(ur('محمد اسلم ولد اکرم سکنہ چک ۴۵')))}
  </div>
  <div class="sh"><span class="ur">تاریخیں</span><div class="hr"></div></div>
  <div class="grid grid3">
    ${field('تاریخ ایف آئی آر', inp(lv('14-11-2026') + cal), true)}
    ${field('تاریخ وقوعہ', inp(lv('13-11-2026') + cal), true)}
    ${field('تاریخ گرفتاری', inp(`<span class="ph2 num">DD-MM-YYYY</span><div class="grow"></div>` + cal))}
  </div>
  <div class="sh"><span class="ur">ملزمان</span><div class="hr"></div></div>
  <div class="list">
    <div class="li"><span class="n num">1</span><div class="grow">${inp(ur('زاہد حسین ولد حسین بخش سکنہ ساہیوال'))}</div><div class="ib s">${ICON('x', 'i14')}</div></div>
    <div class="li"><span class="n num">2</span><div class="grow">${inp(`<span class="ur" style="flex:none">طارق جاوید ولد جاوید اقبال سکنہ فیص</span><span class="caret" style="margin-right:-7px"></span><div class="grow"></div>`, { focus: true })}</div><div class="ib s">${ICON('x', 'i14')}</div></div>
    <div class="addl">${ICON('plus', 'i14')}Add accused</div>
  </div>
  <div class="sh"><span class="ur">گواہان</span><div class="hr"></div></div>
  <div class="list">
    <div class="li"><span class="n num">1</span><div class="grow">${inp(ur('کامران اکبر ولد اکبر علی سکنہ سیالکوٹ'))}</div><div class="ib s">${ICON('x', 'i14')}</div></div>
    <div class="addl">${ICON('plus', 'i14')}Add witness</div>
  </div>
  <div class="sh"><span class="ur">تفتیش</span><div class="hr"></div></div>
  <div class="grid">
    ${field('تفتیشی افسر', inp(ur('انسپکٹر ملک ارشد')))}
    ${field('تحریر کنندہ', inp(ur('اے ایس آئی رشید احمد')))}
  </div>
  <div class="sh"><span class="ur">موبائل</span><div class="hr"></div></div>
  <div class="grid">
    ${field('ایمی نمبر 1', inp(lv('358240051111110')))}
    ${field('سم نمبر 1', inp(lv('03001234567')))}
  </div>
</div></div>
<div class="foot">
  <div class="t12 m row" style="gap:6px">${ICON('circle-alert', 'i14')}Not saved yet</div>
  <div class="grow"></div>
  <div class="btn ghost">Cancel</div>
  <div class="btn primary">Create FIR<span class="kbd">Ctrl S</span></div>
</div>`;
</script></body></html>
