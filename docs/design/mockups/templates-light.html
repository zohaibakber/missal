<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="missal.css"><script src="chrome.js"></script>
<style>
.body { flex: 1; min-height: 0; display: flex; }
.list { width: 320px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.lh { height: 44px; display: flex; align-items: center; padding: 0 12px 0 16px; gap: 8px; }
.srch { margin: 0 12px 8px; height: 36px; border: 1px solid var(--input); border-radius: 6px; display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; padding: 0 10px; }
.srch.focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.tp { height: 44px; margin: 0 8px; border-radius: 6px; display: flex; flex-direction: row-reverse; align-items: center; padding: 0 10px; gap: 10px; }
.tp.on { background: var(--accent-sub); }
.tp .ur { font-size: 16px; line-height: 30px; }
.tp .fc { font-size: 12px; color: var(--subtle); flex: none; }
.center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas); }
.th { height: 52px; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--border); }
.etb { height: 40px; flex: none; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 8px; gap: 2px; }
.etb .vr { margin: 10px 6px; }
.cv { flex: 1; overflow: hidden; padding: 20px 24px 0; }
.page { width: 640px; margin: 0 auto; background: var(--paper); color: var(--ink); border-radius: 2px; box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); padding: 40px 52px; min-height: 900px; direction: rtl; font-family: "Nastaleeq"; font-size: 16px; line-height: 32px; word-spacing: .14em; }
.lab { color: var(--accent-text); background: var(--field-fill); border-radius: 3px; padding: 0 3px; }
.rule { border-top: 1px solid var(--ink); margin: 2px 0; }
.dline { display: flex; justify-content: space-between; }
mark { background: color-mix(in srgb, var(--warn-line) 30%, transparent); color: inherit; border-radius: 2px; }
</style></head>
<body><div class="app" id="app"></div>
<script>
const items = [["چالان آپریشن بغیر فرد ملزم جوڈیشل جنرل", 18], ["چالان آپریشن پسٹل ملزم جوڈیشل", 21], ["چالان آپریشن شراب ملزم جوڈیشل", 19], ["چالان آپریشن فرد ملزمان جوڈیشل جنرل", 24], ["چالان انویسٹی گیشن 401 ملزمان جوڈیشل", 26], ["چالان انویسٹی گیشن 401 ملزمان ڈسچارج", 25], ["چالان منشیات ملزم جوڈیشل", 17], ["چالان 512 ض ف انویسٹی گیشن 489F", 22], ["مکمل چالان 489F", 23]];
const hl = (t) => t.replace('چالان', '<mark>چالان</mark>');
document.getElementById('app').innerHTML = `
${titlebar({ title: `<span class="ur ur18" style="font-weight:400;margin-top:-4px">چالان انویسٹی گیشن 401 ملزمان جوڈیشل</span>`, actions: `<span class="row s t12" style="gap:6px;margin-right:6px">${ICON('check', 'i12')}Saved</span><div class="ib" title="Rename (F2)">${ICON('pencil')}</div><div class="ib" title="Preview (Ctrl P)">${ICON('printer')}</div><div class="ib" title="More">${ICON('ellipsis')}</div><div class="vr"></div>` })}
<div class="body">
  <div class="list">
    <div class="lh"><span class="t13 w5">Templates</span><span class="s t13 num">36</span><div class="grow"></div><div class="ib" title="Import Word file (Ctrl O)">${ICON('file-up')}</div><div class="ib" title="New template (Shift N)">${ICON('plus')}</div></div>
    <div class="srch focus"><span class="s" style="display:flex">${ICON('search', 'i14')}</span><span class="ur ur16" style="margin-top:-2px">چالان</span><span class="caret" style="margin-right:-6px"></span><div class="grow"></div><div class="ib sm s" style="margin-left:-6px">${ICON('x', 'i14')}</div></div>
    <div class="t12 s" style="padding:2px 18px 6px">9 of 36</div>
    ${items.map((t, i) => `<div class="tp${i === 4 ? ' on' : ''}"><span class="ur trunc grow">${hl(t[0])}</span><span class="fc num">${t[1]} fields</span></div>`).join('')}
  </div>
  <div class="center">
    
      <div class="etb">
      <div class="ib">${ICON('undo-2')}</div><div class="ib dis">${ICON('redo-2')}</div>
      <div class="vr"></div>
      <div class="ib">${ICON('bold')}</div><div class="ib">${ICON('italic')}</div><div class="ib">${ICON('underline')}</div>
      <div class="vr"></div>
      <div class="ib">${ICON('text-align-start')}</div><div class="ib">${ICON('text-align-center')}</div><div class="ib on">${ICON('text-align-end')}</div><div class="ib">${ICON('text-align-justify')}</div>
      <div class="vr"></div>
      <div class="ib">${ICON('list')}</div><div class="ib">${ICON('list-ordered')}</div>
      <div class="vr"></div>
      <div class="ib" title="Insert field («»)">${ICON('braces')}</div>
      <div class="grow"></div>
      <div class="ib sm">${ICON('minus', 'i14')}</div><div class="t12 m num" style="width:36px;text-align:center">90%</div><div class="ib sm">${ICON('plus', 'i14')}</div>
    </div>
    <div class="cv"><div class="page">
      <div class="dline"><span class="lab">تھانہ نام</span><span class="lab" style="margin-left:150px">ضلع نام</span></div>
      <div>سرکاربذریعہ &nbsp;<span class="lab">مدعی مقدمہ</span></div>
      <div class="rule"></div>
      <div class="dline"><span>مقدمہ نمبر : <span class="lab">مقدمہ نمبر</span></span><span>مورخہ: <span class="lab">Date FIR</span></span><span>جرم : <span class="lab">جرم</span></span><span class="lab">تھانہ نام</span></div>
      <div class="rule"></div>
      <div>بنام : <span class="lab">نام ملزم و سکونت</span></div>
      <div class="rule"></div>
      <div style="text-align:center;font-size:22px;line-height:44px;margin:20px 0 10px"><span style="border-bottom:1.5px solid var(--ink)">فرد برآمدگی و مقبوضگی &nbsp;<span class="lab">برآمدگی</span></span></div>
      <div style="text-align:justify">روبرو گواہان ذیل تحریر ہے کہ ملزمان <span class="lab">نام ملزم و سکونت 1</span>، <span class="lab">نام ملزم و سکونت 2</span>، مذکور نے مقدمہ ہذا کی واردات کرنے کا انکشاف کرتے ہوئے مقدمہ ہذا کا مال مسروقہ اپنے کوارٹر سے برآمد کروانے کا انکشاف کیا لہذا ملزمان مذکور کو تکمیل انکشاف کے لئے بحراست پولیس لے کر مسکن ملزمان پہنچے تو ملزمان نے بحراست پولیس آگے آگے چلتے ہوئے مکان ازان خود کی نشاندہی کرتے ہوئے اپنے کواٹر میں داخل ہو کر رہائشی کمرہ میں رکھے ہوئے آہنی ٹرنک کو کھول کر مال مسروقہ <span class="lab">برآمدگی</span> ازخود نکال کر میرے پیش کیا۔</div>
      <div style="margin-top:28px">گواہان: <span class="lab">گواہان 1</span>، <span class="lab">گواہان 2</span></div>
    </div></div>
  </div>
</div>`;
</script></body></html>
