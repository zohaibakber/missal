<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="missal.css"><script src="chrome.js"></script>
<style>
.toolbar { height: 52px; padding-top: 4px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; }
.search { width: 300px; }
.seg { display: flex; align-items: center; gap: 2px; }
.seg .s-item { height: 28px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
.seg .s-item.on { background: var(--pressed); color: var(--fg); }
.seg .s-item .n { color: var(--subtle); font-weight: 400; }
.seg .s-item.on .n { color: var(--muted); }
.seg .ur { font-size: 15px; line-height: 26px; margin-top: -3px; }

.table { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 24px; }
.tr { display: flex; flex-direction: row-reverse; align-items: center; height: 44px; border-bottom: 1px solid var(--border); position: relative; }
.th { height: 36px; color: var(--muted); }
.th .c { gap: 4px; }
.th .ur { font-size: 14px; line-height: 26px; margin-top: -2px; }
.c { display: flex; flex-direction: row-reverse; align-items: center; padding: 0 8px; min-width: 0; height: 100%; }
.c-sel { width: 36px; justify-content: center; padding: 0; }
.c-no { width: 108px; }
.c-off { flex: 1.1; }
.c-acc { flex: 1; }
.c-st { width: 132px; gap: 8px; }
.c-dt { width: 112px; }
.c-act { width: 36px; justify-content: center; padding: 0; }
.tr .no { font-weight: 500; font-size: 14px; }
.tr .dt { font-size: 13px; color: var(--muted); }
.tr.hov { background: var(--hover); }
.tr.foc { background: var(--hover); }
.tr.foc::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.tr.sel { background: var(--accent-sub); }
.hide { visibility: hidden; }
.sortic { color: var(--fg); }
</style></head>
<body ><div class="app" id="app"></div>
<script>
const rows = [
  ["7/2026", 1, 0, "challan", "01-10-2026"],
  ["8/2026", 1, 9, "challan", "13-12-2026"],
  ["3/2024", 1, 4, "open", "11-02-2024"],
  ["12/2021", 1, 6, "closed", "28-07-2021"],
];
const row = (r, i) => {
  const cls = i < 2 ? ' sel' : i === 2 ? ' foc' : '';
  const showSel = true;
  return `<div class="tr${cls}">
    <div class="c c-sel"><div class="chk${i < 2 ? ' on' : ''}">${i < 2 ? ICON('check', 'i12') : ''}</div></div>
    <div class="c c-no"><span class="no ltr num">${r[0]}</span></div>
    <div class="c c-off"><span class="ur ur16 trunc">${OFFENCES[r[1]]}</span></div>
    <div class="c c-acc"><span class="ur ur16 m trunc">${NAMES[r[2]]}${r[2] % 3 === 0 ? ' <span class="s t13 ltr" style="font-family:Inter;margin-right:6px">+1</span>' : ''}</span></div>
    <div class="c c-st"><span class="dot ${STATUS[r[3]][1]}"></span><span class="ur ur16">${STATUS[r[3]][0]}</span></div>
    <div class="c c-dt"><span class="dt ltr num">${r[4]}</span></div>
    <div class="c c-act"></div>
  </div>`;
};
document.getElementById('app').innerHTML = `
  ${titlebar({ title: 'FIRs', meta: '<span class="num">4 of 90</span>', actions: `<div class="row" style="gap:6px"><span class="t13 w5 num" style="margin-right:4px">2 selected</span><div class="btn ghost sm m">Clear</div><div class="btn danger-outline sm">${ICON('trash', 'i14')}Delete 2 FIRs</div></div>` })}
  <div class="toolbar">  
    <div class="field search focus">${ICON('search', 'i14')}<span class="grow" style="display:flex;flex-direction:row-reverse;align-items:center"><span class="ur ur16" style="margin-top:-2px">ڈکیتی</span><span class="caret"></span></span><div class="ib sm" style="margin-right:-6px">${ICON('x', 'i14')}</div></div>
    <div class="seg">
      <div class="s-item on">All <span class="n num">4</span></div>
      <div class="s-item"><span class="dot d-open"></span><span class="ur">زیر التوا</span><span class="n num">1</span></div>
      <div class="s-item"><span class="dot d-inv"></span><span class="ur">زیر تفتیش</span><span class="n num">0</span></div>
      <div class="s-item"><span class="dot d-challan"></span><span class="ur">چالان جمع</span><span class="n num">2</span></div>
      <div class="s-item"><span class="dot d-closed"></span><span class="ur">بند</span><span class="n num">1</span></div>
    </div>
    <div class="grow"></div>
    <div class="ib" title="Columns">${ICON('columns-3')}</div>
  </div>
  <div class="table">
    <div class="tr th">
      <div class="c c-sel"><div class="chk"></div></div>
      <div class="c c-no"><span class="ur">ایف آئی آر نمبر</span><span class="sortic">${ICON('arrow-down', 'i12')}</span></div>
      <div class="c c-off"><span class="ur">جرم</span></div>
      <div class="c c-acc"><span class="ur">ملزمان</span></div>
      <div class="c c-st"><span class="ur">حالت</span></div>
      <div class="c c-dt"><span class="ur">تاریخ ایف آئی آر</span></div>
      <div class="c c-act"></div>
    </div>
    ${rows.map(row).join('')}
  </div>`;
</script></body></html>
