[workspace]
resolver = "3"
members = ["crates/missal-app", "crates/missal-core", "crates/missal-docx", "crates/missal-editor", "crates/missal-page", "crates/missal-store", "crates/missal-text"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
missal-core = { path = "crates/missal-core" }
missal-docx = { path = "crates/missal-docx" }
missal-editor = { path = "crates/missal-editor" }
missal-page = { path = "crates/missal-page" }
missal-store = { path = "crates/missal-store" }
missal-text = { path = "crates/missal-text" }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
unicode-general-category = "1.1.0"
unicode-segmentation = "1.13.3"
rusqlite = { version = "0.42", features = ["bundled"] }
flate2 = "1.1.11"
uuid = { version = "1.29.2", features = ["v4"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
gpui-kit = "=0.9.1"
parley = "=0.12.0"
swash = "0.2.10"
gpui-pre-wgpu = "=0.3.12"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
roxmltree = "0.21.2"
pdf-writer = "0.15.0"
subsetter = { version = "0.2.6", default-features = false }
chrono = { version = "0.4.45", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
debug = false

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.gpui-base]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.parley]
opt-level = 3

[profile.dev.package.parley_engine]
opt-level = 3

[profile.dev.package.fontique]
opt-level = 3

[profile.dev.package.harfrust]
opt-level = 3

[profile.dev.package.skrifa]
opt-level = 3

[profile.dev.package.read-fonts]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3

[profile.dev.package.zeno]
opt-level = 3
