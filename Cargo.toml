[workspace]
resolver = "3"
members = ["crates/missal-core", "crates/missal-store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
missal-core = { path = "crates/missal-core" }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
unicode-general-category = "1.1.0"
rusqlite = { version = "0.42", features = ["bundled"] }
flate2 = "1.1.11"
uuid = { version = "1.29.2", features = ["v4"] }
sha2 = "0.11.1"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
