name: Auto-merge

# Squash-merges a pull request as soon as CI passes on its latest commit, so
# nobody has to press Merge. A pull request is left alone while it is a draft,
# while it carries the "no-auto-merge" label, when it comes from a fork, or
# when a bot (Dependabot) opened it.
#
# The merge is made with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do not
# start other workflows, so the merge alone would not run CI on main and the
# release would never ship. After merging, this workflow starts CI on main
# itself with workflow_dispatch, which GITHUB_TOKEN is allowed to trigger.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # CI can finish before the pull request is opened, or while it is a draft.
  pull_request:
    types: [opened, reopened, ready_for_review, unlabeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch || github.head_ref }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge when CI passes
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch != github.event.repository.default_branch
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EVENT: ${{ github.event_name }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Merge
        run: |
          set -euo pipefail

          if [ "${EVENT}" = "workflow_run" ]; then
            number="$(gh api "repos/${GH_REPO}/pulls?state=open&head=${OWNER}:${RUN_BRANCH}" --jq '.[0].number // empty')"
            if [ -z "${number}" ]; then
              echo "No open pull request for ${RUN_BRANCH}."
              exit 0
            fi
          else
            number="${PR_NUMBER}"
          fi

          pr="$(gh api "repos/${GH_REPO}/pulls/${number}")"
          sha="$(jq -r '.head.sha' <<< "${pr}")"
          title="$(jq -r '.title' <<< "${pr}")"

          if [ "$(jq -r '.state' <<< "${pr}")" != "open" ]; then
            echo "#${number} is not open."; exit 0
          fi
          if [ "$(jq -r '.draft' <<< "${pr}")" = "true" ]; then
            echo "#${number} is a draft."; exit 0
          fi
          if [ "$(jq -r '.user.type' <<< "${pr}")" = "Bot" ]; then
            echo "#${number} was opened by a bot."; exit 0
          fi
          if [ "$(jq -r '.base.ref' <<< "${pr}")" != "${DEFAULT_BRANCH}" ]; then
            echo "#${number} does not target ${DEFAULT_BRANCH}."; exit 0
          fi
          if jq -e '.labels[] | select(.name == "no-auto-merge")' <<< "${pr}" > /dev/null; then
            echo "#${number} has the no-auto-merge label."; exit 0
          fi

          # Only merge the exact commit CI passed on. A newer push starts a new
          # CI run, which brings this workflow back when it finishes.
          if [ "${EVENT}" = "workflow_run" ]; then
            if [ "${sha}" != "${RUN_SHA}" ]; then
              echo "#${number} moved on to ${sha}; waiting for its CI run."; exit 0
            fi
          else
            conclusion="$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "none"')"
            if [ "${conclusion}" != "success" ]; then
              echo "CI on ${sha} is ${conclusion}; the merge waits for it to pass."; exit 0
            fi
          fi

          echo "Merging #${number} at ${sha}."
          if ! gh api -X PUT "repos/${GH_REPO}/pulls/${number}/merge" \
              -f merge_method=squash -f sha="${sha}" \
              -f commit_title="${title} (#${number})"; then
            echo "::warning::Could not merge #${number}. It may have conflicts with ${DEFAULT_BRANCH}."
            exit 0
          fi

          # Run CI on main, which releases the next version and deploys the API.
          gh api -X POST "repos/${GH_REPO}/actions/workflows/ci.yml/dispatches" -f ref="${DEFAULT_BRANCH}"
