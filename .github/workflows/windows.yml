name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check formatting, lint and types
        run: vp check

      - name: Test
        run: vp test

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: vp run make

      - name: Build and publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: vp run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: missal-windows-x64
          path: release/*/*.exe
          if-no-files-found: error
