name: Windows build

# Every branch push builds the installer and uploads it as a workflow artifact.
# Pushing a version tag (e.g. `v0.2.0`, matching package.json) also publishes a draft GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    # Squirrel.Windows can only be built on Windows (or Linux with wine + mono).
    permissions:
      contents: write # `electron-forge publish` creates the GitHub Release on tags.
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs Vite+, Node.js and the project's package manager (bun, from `packageManager`).
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check formatting, lint and types
        run: vp check

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: vp run make

      - name: Build and publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: vp run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: missal-windows-x64
          path: |
            out/make/squirrel.windows/x64/*
            out/make/zip/win32/x64/*.zip
          if-no-files-found: error
