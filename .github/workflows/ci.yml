name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep file:line in test backtraces but drop the rest of the
  # debug info, which makes workspace crates faster to link and the cache smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: short
  VPK_VERSION: 1.3.39-g8d2844f
  API_URL: ${{ vars.API_URL }}
  PURCHASE_URL: ${{ vars.PURCHASE_URL }}

jobs:
  # Decides whether this run publishes a release. A pushed v* tag releases that
  # tag. A push to main releases when the workspace version in Cargo.toml has
  # no tag yet, so bumping the version in a merged pull request ships it; the
  # release job creates the tag. (A tag pushed with GITHUB_TOKEN would not
  # start another run, so the release is built here, in the main run.)
  version:
    name: Release version
    timeout-minutes: 5
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide
        id: decide
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          tag="v${version}"
          release=false
          if [ "${GITHUB_REF}" = "refs/tags/${tag}" ]; then
            release=true
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "${tag} is already released"
            else
              release=true
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "release=${release} for ${tag}"

  check:
    name: Check and test (Linux)
    timeout-minutes: 60
    # A branch in this repository already gets a push run for the same commit,
    # and its checks show on the pull request, so the pull_request run would
    # only repeat it. Pull requests from forks still run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libzstd-dev clang cmake pkg-config mesa-vulkan-drivers

      - name: Install Rust
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build examples
        run: cargo build -p missal-app --features headless --examples

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "missal-app") | .version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the missal-app version v${version}"
            exit 1
          fi

  windows:
    name: Build (Windows)
    timeout-minutes: 60
    # A branch in this repository already gets a push run for the same commit,
    # and its checks show on the pull request, so the pull_request run would
    # only repeat it. Pull requests from forks still run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      # The dev-dependencies turn on gpui-kit's test-support feature, so a plain
      # `cargo build` here compiled the whole gpui stack a second time just for
      # this step. `cargo check` still proves the app compiles without the test
      # features; the test build below compiles and links the missal binary.
      - name: Check
        run: cargo check -p missal-app

      - name: Clippy
        run: cargo clippy -p missal-app --all-targets -- -D warnings

      - name: Compile tests
        run: cargo test --workspace --no-run

  cloud:
    name: Check and test (API)
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: cloud
          node-version: "24.11.1"
          cache: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test

  package-windows:
    name: Package (Windows installer)
    timeout-minutes: 60
    if: needs.version.outputs.release == 'true'
    needs: [version, check, windows]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build release binary
        run: cargo build --release -p missal-app

      - name: Install vpk
        run: dotnet tool install --global vpk --version $env:VPK_VERSION

      - name: Pack installer
        run: |
          ./packaging/windows/pack.ps1 -Version $env:VERSION -Output dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package (Linux AppImage and deb)
    timeout-minutes: 60
    if: needs.version.outputs.release == 'true'
    needs: [version, check, windows]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libzstd-dev clang cmake pkg-config mesa-vulkan-drivers squashfs-tools

      - name: Install Rust
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build release binary
        run: cargo build --release -p missal-app

      - name: Install vpk
        run: dotnet tool install --global vpk --version "$VPK_VERSION"

      - name: Pack AppImage
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          ./packaging/linux/pack.sh "$VERSION" dist

      - name: Build deb
        run: ./packaging/linux/build-deb.sh target/release/missal "$VERSION" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  deploy-api:
    name: Deploy API
    timeout-minutes: 15
    if: needs.version.outputs.release == 'true'
    needs: [version, cloud, package-windows, package-linux]
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-api-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: cloud
          node-version: "24.11.1"
          cache: true

      - name: Check credentials
        run: vp exec alchemy provider check-env --provider Cloudflare

      - name: Deploy
        run: vp exec alchemy deploy --stage prod --yes

      - name: Check the live API
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --output /dev/null "${API_URL}/openapi.json"

  release:
    name: Release
    timeout-minutes: 30
    if: needs.version.outputs.release == 'true'
    needs: [version, package-windows, package-linux, deploy-api]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --latest --generate-notes \
            --title "Missal ${VERSION}"
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
