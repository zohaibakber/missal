name: CI

on:
  push:
    branches: ["**"]
    tags: ["native-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  VPK_VERSION: 1.3.39-g8d2844f

jobs:
  check:
    name: Check and test (Linux)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libzstd-dev clang cmake pkg-config mesa-vulkan-drivers

      - name: Install Rust
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build examples
        run: cargo build -p missal-app --features headless --examples

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/native-v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "missal-app") | .version')"
          if [ "native-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the missal-app version native-v${version}"
            exit 1
          fi

  windows:
    name: Build (Windows)
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build
        run: cargo build -p missal-app

      - name: Clippy
        run: cargo clippy -p missal-app --all-targets -- -D warnings

      - name: Compile tests
        run: cargo test --workspace --no-run

  package-windows:
    name: Package (Windows installer)
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [check, windows]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build release binary
        run: cargo build --release -p missal-app

      - name: Install vpk
        run: dotnet tool install --global vpk --version $env:VPK_VERSION

      - name: Pack installer
        run: |
          $version = $env:GITHUB_REF_NAME.Substring("native-v".Length)
          ./packaging/windows/pack.ps1 -Version $version -Output dist-native

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows
          path: dist-native/*
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package (Linux AppImage and deb)
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [check, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libzstd-dev clang cmake pkg-config mesa-vulkan-drivers squashfs-tools

      - name: Install Rust
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build release binary
        run: cargo build --release -p missal-app

      - name: Install vpk
        run: dotnet tool install --global vpk --version "$VPK_VERSION"

      - name: Pack AppImage
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          ./packaging/linux/pack.sh "${GITHUB_REF_NAME#native-v}" dist-native

      - name: Build deb
        run: ./packaging/linux/build-deb.sh target/release/missal "${GITHUB_REF_NAME#native-v}" dist-native

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux
          path: dist-native/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft release
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [package-windows, package-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-native
          merge-multiple: true

      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" dist-native/* \
            --draft --latest=false --verify-tag \
            --title "Missal native ${GITHUB_REF_NAME#native-v}" \
            --notes "Native (Rust and GPUI) build. Publish this draft, then confirm it is not marked as the latest release: the retired Electron installs read the latest release."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
